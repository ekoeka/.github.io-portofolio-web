<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Proyek</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html"><span class="brand-mark">E<span>.</span></span><span>EKA <small>ENGINEERING PORTFOLIO</small></span></a>
        <nav class="main-nav" aria-label="Navigasi utama"><a href="index.html#proyek">Proyek</a><a href="index.html#keahlian">Keahlian</a><a href="index.html#perjalanan">Perjalanan</a></nav>
        <button type="button" id="theme-toggle" class="tombol-floating" aria-label="Mode gelap" aria-pressed="true"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i> Tema</button>
    </header>
    
    <main class="container-pusat">
        <div style="text-align:left; margin-bottom:20px;">
            <a href="index.html" class="tombol-buka" style="display:inline-block; width:auto;">Kembali ke proyek</a>
        </div>

        <div class="kartu-profile">
            <div class="layout-golden">
                <div class="area-teks">
                    <div style="border-bottom:1px solid var(--line); padding-bottom:15px; margin-bottom:15px;">
                        <h1 id="judul" aria-live="polite" style="margin:0; font-size:2.5rem;">Loading...</h1>
                        <span id="tanggal" style="opacity:0.7; font-family:'Space Mono'">...</span>
                        <div id="tags" class="tag-container" style="margin-top:10px;"></div>
                    </div>
                    <div id="deskripsi" style="white-space:pre-wrap; line-height:1.8;">...</div>
                </div>

                <div class="area-visual">
                    <section id="project-gallery" class="project-gallery" aria-label="Galeri gambar proyek" aria-roledescription="carousel">
                        <div id="gallery-controls-top" class="gallery-controls" hidden>
                            <button id="gallery-up" type="button" aria-label="Geser gambar ke atas"></button>
                            <span id="gallery-position" aria-live="polite"></span>
                            <button id="gallery-toggle" type="button" aria-label="Jeda putar otomatis"></button>
                        </div>
                        <div id="gallery-viewport" class="gallery-viewport">
                            <div id="gallery-track" class="gallery-track"></div>
                            <p id="gallery-placeholder" class="gallery-placeholder" role="status" hidden>Gambar proyek tidak tersedia.</p>
                        </div>
                        <div id="gallery-controls-bottom" class="gallery-controls gallery-controls-bottom" hidden>
                            <button id="gallery-down" type="button" aria-label="Geser gambar ke bawah"></button>
                        </div>
                    </section>

                    <div style="margin-top:20px;">
                        
                        <a id="btn-github" href="#" target="_blank" rel="noopener noreferrer" class="tombol-buka" style="margin-top:10px; display:none;">
                            <i class="fa-brands fa-github"></i> GitHub Repo
                        </a>
                        
                        <a id="btn-youtube" href="#" target="_blank" rel="noopener noreferrer" class="tombol-youtube" style="display:none;">
                            <i class="fa-brands fa-youtube"></i> Tonton Demo
                        </a>

                        <a id="btn-jurnal" href="#" target="_blank" rel="noopener noreferrer" class="tombol-jurnal" style="display:none;">
                            <i class="fa-solid fa-book-open"></i> Baca Dokumen
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <dialog id="image-lightbox" class="image-lightbox" aria-label="Penampil gambar proyek">
        <div class="lightbox-toolbar">
            <span id="lightbox-position" aria-live="polite"></span>
            <button id="lightbox-zoom-out" type="button" aria-label="Perkecil gambar">−</button>
            <button id="lightbox-zoom-in" type="button" aria-label="Perbesar gambar">+</button>
            <button id="lightbox-zoom-reset" type="button" aria-label="Reset zoom">100%</button>
            <button id="lightbox-close" type="button" aria-label="Tutup penampil gambar">×</button>
        </div>
        <button id="lightbox-prev" class="lightbox-arrow lightbox-prev" type="button" aria-label="Gambar sebelumnya">‹</button>
        <div id="lightbox-stage" class="lightbox-stage">
            <img id="lightbox-image" alt="" hidden>
            <p id="lightbox-error" role="status" hidden>Gambar tidak tersedia.</p>
        </div>
        <button id="lightbox-next" class="lightbox-arrow lightbox-next" type="button" aria-label="Gambar berikutnya">›</button>
    </dialog>

    <script src="theme.js"></script>
    <script src="data.js"></script>
    <script src="ui.js"></script>
    <script src="detail.js"></script>
</body>
</html>
