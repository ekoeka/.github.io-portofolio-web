<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Proyek</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button type="button" id="theme-toggle" class="tombol-floating" aria-label="Mode gelap" aria-pressed="false">🌓 Mode</button>
    
    <main class="container-pusat">
        <div style="text-align:left; margin-bottom:20px;">
            <a href="index.html" class="tombol-buka" style="display:inline-block; width:auto;">← Kembali</a>
        </div>

        <div class="kartu-profile" style="display:block;">
            <div class="layout-golden">
                <div class="area-teks">
                    <div style="border-bottom:1px solid var(--icon-color); padding-bottom:15px; margin-bottom:15px;">
                        <h1 id="judul" aria-live="polite" style="margin:0; font-size:2.5rem;">Loading...</h1>
                        <span id="tanggal" style="opacity:0.7; font-family:'Space Mono'">...</span>
                        <div id="tags" class="tag-container" style="margin-top:10px;"></div>
                    </div>
                    <div id="deskripsi" style="white-space:pre-wrap; line-height:1.8;">...</div>
                </div>

                <div class="area-visual">
                    <div id="slider-area" class="slider-container" style="display:none;"></div>
                    <img id="single-img" alt="" style="width:100%; border-radius:10px; display:none;">
                    
                    <div style="margin-top:20px;">
                        
                        <a id="btn-github" href="#" target="_blank" rel="noopener noreferrer" class="tombol-buka" style="margin-top:10px; display:none;">
                            <i class="fa-brands fa-github"></i> GitHub Repo
                        </a>
                        
                        <a id="btn-youtube" href="#" target="_blank" rel="noopener noreferrer" class="tombol-youtube" style="display:none;">
                            <i class="fa-brands fa-youtube"></i> Tonton Demo
                        </a>

                        <a id="btn-jurnal" href="#" target="_blank" rel="noopener noreferrer" class="tombol-jurnal" style="display:none;">
                            <i class="fa-solid fa-book-open"></i> Baca Dokumen
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="theme.js"></script>
    <script src="data.js"></script>
    <script src="detail.js"></script>
</body>
</html>
