<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - IoT Engineer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <button type="button" id="theme-toggle" class="tombol-floating" aria-label="Mode gelap" aria-pressed="false">
        🌓 Mode
    </button>

    <nav class="sosmed-container" aria-label="Media sosial">
        <a href="#" class="ikon-sosmed" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
        <a href="#" class="ikon-sosmed" aria-label="LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
        <a href="#" class="ikon-sosmed" aria-label="Email"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
    </nav>

    <main class="container-pusat">
        
        <div class="kartu-profile">
            <div class="info-kiri">
                <h1>Halo, <br>Saya Eka! 👋</h1>
                <p>Mahasiswa Teknik Elektro Telkom University.<br>Fokus pada IoT & Embedded AI.</p>
            </div>
            <div class="ornamen-kanan">☁️</div>
        </div>

        <h2 class="judul-bagian" style="margin-top:0;">Keahlian Teknis</h2>
        <div class="skill-wrapper" tabindex="0" aria-label="Daftar keahlian">
            <div id="wadah-skill" aria-live="polite" class="skill-track">Memuat Skill...</div>
        </div>

        <div class="layout-dua-kolom">
            <div class="kartu-info">
                <h3 class="judul-kecil"><i class="fa-solid fa-graduation-cap"></i> Pendidikan</h3>
                <div id="wadah-pendidikan" aria-live="polite">Memuat...</div>
            </div>
            <div class="kartu-info">
                <h3 class="judul-kecil"><i class="fa-solid fa-certificate"></i> Course & Sertifikasi</h3>
                <div id="wadah-course" aria-live="polite" class="course-grid">Memuat...</div>
            </div>
        </div>

        <h2 class="judul-bagian">Proyek Terbaru</h2>
        <div id="wadah-proyek" aria-live="polite" class="container-proyek">Memuat Proyek...</div>

        <h2 class="judul-bagian">Jejak Karir & Prestasi</h2> <div class="layout-dua-kolom">
            <div class="kartu-info">
                <h3 class="judul-kecil"><i class="fa-solid fa-briefcase"></i> Pengalaman</h3>
                <div id="wadah-experience" aria-live="polite">Memuat...</div>
            </div>
            <div class="kartu-info">
                <h3 class="judul-kecil"><i class="fa-solid fa-trophy"></i> Prestasi</h3>
                <div id="wadah-achievement" aria-live="polite">Memuat...</div>
            </div>
        </div>

    </main>

    <script src="theme.js"></script>
    <script src="data.js"></script>
    <script src="ui.js"></script>
    <script src="index.js"></script>
</body>
</html>
